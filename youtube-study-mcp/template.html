<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<!-- Generated by youtube-study-mcp from __SPEC__. Edit the spec and rebuild; do not edit this file. -->
<style>
  :root { --bg:#111418; --panel:#1a1f26; --line:#2a313b; --text:#e6e8eb; --muted:#9aa3ad; --accent:#e0533d; --done:#3fa66b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, Helvetica, Arial, sans-serif; display:flex; height:100vh; }
  main { flex:1; display:flex; flex-direction:column; padding:16px 20px; min-width:0; }
  #playerWrap { position:relative; width:100%; aspect-ratio:16/9; max-height:calc(100vh - 210px); background:#000; border-radius:8px; overflow:hidden; }
  #player { position:absolute; inset:0; width:100%; height:100%; }
  .bar { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button, select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  #now { margin-top:12px; }
  #now h2 { margin:0 0 4px; font-size:18px; }
  #now .note { color:var(--muted); }
  #check { margin-top:10px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel); border-radius:4px; display:none; }
  aside { width:340px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:14px 0; }
  aside h1 { font-size:15px; margin:0 16px 4px; }
  aside .sub { color:var(--muted); font-size:12px; margin:0 16px 12px; }
  .topic { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin:14px 16px 4px; }
  .seg { display:flex; gap:10px; padding:8px 16px; cursor:pointer; border-left:3px solid transparent; }
  .seg:hover { background:#20262e; }
  .seg.active { border-left-color:var(--accent); background:#232a33; }
  .seg input { margin-top:3px; accent-color:var(--done); }
  .seg .t { font-size:14px; }
  .seg .m { color:var(--muted); font-size:12px; }
  .seg.done .t { color:var(--muted); text-decoration:line-through; }
  label.inline { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
</style>
</head>
<body>
<main>
  <div id="playerWrap"><div id="player"></div></div>
  <div class="bar">
    <button id="prev">◀ Prev</button>
    <button id="play" class="primary">Play</button>
    <button id="next">Next ▶</button>
    <label class="inline">Speed
      <select id="speed"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
    </label>
    <label class="inline"><input type="checkbox" id="auto" checked> Auto-advance</label>
    <label class="inline"><input type="checkbox" id="pause" checked> Pause at checks</label>
    <span class="inline" style="color:var(--muted);font-size:12px">Keys: <kbd>N</kbd> next · <kbd>P</kbd> prev · <kbd>Space</kbd> play/pause</span>
  </div>
  <div id="now"><h2></h2><div class="note"></div></div>
  <div id="check"></div>
</main>
<aside>
  <h1 id="pageTitle"></h1>
  <div class="sub" id="total"></div>
  <div id="list"></div>
</aside>

<script>
const PAGE_TITLE = __TITLE_JSON__;
const SERVED_URL = __SERVED_URL_JSON__;
const PING_URL = __PING_URL_JSON__;
const OPEN_HINT = __LAUNCHER_JSON__;
const STORE = __STORE_JSON__;
// Each segment plays only start..end of its video, then moves on.
// "check" is shown (and playback pauses, if enabled) when that segment ends.
const SEGMENTS = __SEGMENTS_JSON__;

// YouTube embeds fail with "Error 153" on file:// pages. If opened that way,
// switch to the local server copy when it is running; otherwise say how to start it.
if (location.protocol === "file:") {
  const ping = document.createElement("script");
  ping.src = PING_URL + "?t=" + Date.now();
  ping.onload = () => location.replace(SERVED_URL);
  ping.onerror = () => {
    const box = document.createElement("div");
    box.id = "fileMsg";
    box.style.cssText = "padding:40px;color:#e6e8eb;font-size:17px;line-height:1.6";
    box.innerHTML = "<b>Videos can't play from a file.</b><br><span></span>";
    box.querySelector("span").textContent = OPEN_HINT;
    document.getElementById("playerWrap").replaceChildren(box);
  };
  document.head.appendChild(ping);
}
document.documentElement.dataset.origin = location.protocol;
document.getElementById("pageTitle").textContent = PAGE_TITLE;

const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s)%60).padStart(2,"0")}`;
const DONE_KEY = STORE + "-done", SPEED_KEY = "study-videos-speed";
const done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
const saveDone = () => localStorage.setItem(DONE_KEY, JSON.stringify([...done]));
let idx = Math.max(0, SEGMENTS.findIndex((_, i) => !done.has(i)));
let player, ready = false;
let loadedAt = 0; // when the current segment was loaded; used to ignore stray "ended" events

const speedSel = document.getElementById("speed");
speedSel.value = localStorage.getItem(SPEED_KEY) || "1.5";
speedSel.onchange = () => { localStorage.setItem(SPEED_KEY, speedSel.value); if (ready) player.setPlaybackRate(+speedSel.value); renderList(); };

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastTopic = null;
  SEGMENTS.forEach((s, i) => {
    if (s.topic !== lastTopic) {
      const h = document.createElement("div"); h.className = "topic"; h.textContent = s.topic; list.appendChild(h); lastTopic = s.topic;
    }
    const row = document.createElement("div");
    row.className = "seg" + (i === idx ? " active" : "") + (done.has(i) ? " done" : "");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = done.has(i);
    cb.onclick = e => { e.stopPropagation(); cb.checked ? done.add(i) : done.delete(i); saveDone(); renderList(); };
    const txt = document.createElement("div");
    const t = document.createElement("div"); t.className = "t"; t.textContent = s.title;
    const m = document.createElement("div"); m.className = "m"; m.textContent = `${fmt(s.start)}–${fmt(s.end)} · ${fmt(s.end - s.start)}`;
    txt.append(t, m);
    row.append(cb, txt);
    row.onclick = () => go(i, true);
    list.appendChild(row);
  });
  const remaining = SEGMENTS.reduce((a, s, i) => a + (done.has(i) ? 0 : s.end - s.start), 0);
  const rate = +speedSel.value;
  document.getElementById("total").textContent =
    `${SEGMENTS.length - done.size} of ${SEGMENTS.length} left · ${fmt(remaining)} at 1× · ${fmt(Math.round(remaining / rate))} at ${rate}×`;
}

function showNow() {
  const s = SEGMENTS[idx];
  document.querySelector("#now h2").textContent = `${s.topic}: ${s.title}`;
  document.querySelector("#now .note").textContent = s.note || "";
  document.getElementById("check").style.display = "none";
}

function go(i, autoplay) {
  if (i < 0 || i >= SEGMENTS.length) return;
  idx = i;
  const s = SEGMENTS[i];
  const opts = { videoId: s.id, startSeconds: s.start, endSeconds: s.end };
  loadedAt = Date.now();
  if (ready) autoplay ? player.loadVideoById(opts) : player.cueVideoById(opts);
  showNow(); renderList();
}

function onSegmentEnd() {
  const s = SEGMENTS[idx];
  // Reloading the same video at a new start time can emit a stale ENDED event.
  // Only treat it as a real end if the right video reached this segment's end time.
  const sameVideo = player.getVideoData().video_id === s.id;
  const atEnd = player.getCurrentTime() >= s.end - 2;
  if (Date.now() - loadedAt < 1500 || !sameVideo || !atEnd) return;
  done.add(idx); saveDone(); renderList();
  if (s.check) {
    const box = document.getElementById("check");
    box.textContent = "Check before moving on: " + s.check;
    box.style.display = "block";
    if (document.getElementById("pause").checked) return;
  }
  if (document.getElementById("auto").checked && idx < SEGMENTS.length - 1) go(idx + 1, true);
}

window.onYouTubeIframeAPIReady = () => {
  const s = SEGMENTS[idx];
  player = new YT.Player("player", {
    videoId: s.id,
    playerVars: { start: s.start, end: s.end, rel: 0, playsinline: 1 },
    events: {
      onReady: () => { ready = true; player.setPlaybackRate(+speedSel.value); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) { player.setPlaybackRate(+speedSel.value); document.getElementById("play").textContent = "Pause"; }
        if (e.data === YT.PlayerState.PAUSED) document.getElementById("play").textContent = "Play";
        if (e.data === YT.PlayerState.ENDED) { document.getElementById("play").textContent = "Play"; onSegmentEnd(); }
      },
    },
  });
};

document.getElementById("prev").onclick = () => go(idx - 1, true);
document.getElementById("next").onclick = () => go(idx + 1, true);
document.getElementById("play").onclick = () => {
  if (!ready) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING) player.pauseVideo();
  else if (st === YT.PlayerState.ENDED) go(idx, true);
  else player.playVideo();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "n" || e.key === "N") go(idx + 1, true);
  if (e.key === "p" || e.key === "P") go(idx - 1, true);
  if (e.key === " ") { e.preventDefault(); document.getElementById("play").click(); }
});

showNow(); renderList();
const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
</script>
</body>
</html>
